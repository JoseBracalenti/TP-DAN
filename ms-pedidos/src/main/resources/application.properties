# Configuración básica de la aplicación
spring.application.name=MS-PEDIDOS
server.port=${SERVER_PORT:8082}

# Configuración RabbitMQ (opcional para desarrollo local)
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}

# Configuración Eureka (opcional para desarrollo local)
eureka.client.serviceUrl.defaultZone=${SPRING_EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
eureka.client.initialInstanceInfoReplicationIntervalSeconds=5
eureka.client.registryFetchIntervalSeconds=5
eureka.instance.leaseRenewalIntervalInSeconds=5
eureka.instance.leaseExpirationDurationInSeconds=5
eureka.client.enabled=${EUREKA_ENABLED:false}

# Configuración específica
dan.pedidos.instancia=${SPRING_INSTANCIA:pedidos-local}
# Configuración para desarrollo local (fallback si no están las variables de entorno)
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URL:mongodb://localhost:27017/pedidos-db}
spring.data.mongodb.database=${SPRING_DATA_MONGODB_DATABASE:pedidos-db}

management.endpoint.metrics.enabled=true
management.endpoints.web.exposure.include=*
management.endpoints.web.exposure.exclude=
management.metrics.web.server.request.autotime.enabled=true
management.endpoint.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true